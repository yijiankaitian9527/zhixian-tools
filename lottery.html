<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>随机抽奖 - 知闲工具箱</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#fff7ed;color:#333;min-height:100vh;padding:16px;max-width:640px;margin:0 auto;text-align:center}
.topnav{display:flex;margin-bottom:12px;text-align:left}
.topnav a{color:#ea580c;text-decoration:none;font-size:17px}
h1{font-size:26px;margin:8px 0 4px;color:#9a3412}
.sub{color:#999;font-size:14px;margin-bottom:16px}
textarea{width:100%;font-size:16px;padding:12px;border:2px solid #fed7aa;border-radius:12px;min-height:120px;margin-bottom:10px;font-family:inherit}
.setrow{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:14px;font-size:17px}
.setrow input{width:70px;font-size:19px;padding:8px;text-align:center;border:2px solid #fed7aa;border-radius:8px}
#winner{font-size:44px;font-weight:bold;color:#c2410c;min-height:110px;display:flex;align-items:center;justify-content:center;background:#fff;border:3px solid #fdba74;border-radius:16px;margin-bottom:16px;padding:16px;line-height:1.3}
#go{background:#ea580c;color:#fff;font-size:22px;font-weight:bold;border:none;border-radius:14px;padding:16px 50px;cursor:pointer;margin-bottom:12px}
#go:active{transform:scale(.96)}
#hist{font-size:14px;color:#78716c;margin-top:8px;line-height:2}
#hist span{background:#ffedd5;border-radius:8px;padding:3px 10px;margin:2px;display:inline-block}
#clearh{background:none;border:none;color:#bbb;font-size:13px;margin-top:6px;text-decoration:underline;cursor:pointer}
.footer{color:#bbb;font-size:12px;margin-top:20px;padding-bottom:20px}
</style>
</head>
<body>
<div class="topnav"><a href="index.html">‹ 返回工具箱</a></div>
<h1>随机抽奖</h1>
<div class="sub">年会抽奖、点名、做决定，一行一个名字</div>

<textarea id="names" placeholder="每行一个名字，比如：&#10;张三&#10;李四&#10;王五"></textarea>
<div class="setrow">一次抽 <input type="number" id="cnt" value="1" min="1" max="20"> 人</div>
<div id="winner">名单填好，点下方开始</div>
<button id="go">🎲 开始抽奖</button>
<div id="hist"></div>
<button id="clearh">清空中奖记录</button>

<div class="footer">知闲工具箱 · 免费 · 无广告 · 不收集信息</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
var hist=[];
function getNames(){
  return $("names").value.split("\n").map(function(s){return s.trim();}).filter(Boolean);
}
var rolling=null;
$("go").onclick=function(){
  var names=getNames();
  if(names.length<2){$("winner").textContent="至少填2个名字";return;}
  var cnt=Math.min(Math.max(parseInt($("cnt").value,10)||1,1),names.length);
  if(rolling)clearInterval(rolling);
  var n=0;
  $("go").textContent="停！";
  rolling=setInterval(function(){
    var shuffled=names.slice().sort(function(){return Math.random()-0.5;});
    $("winner").textContent=shuffled.slice(0,cnt).join("、");
    if(++n>16){
      clearInterval(rolling);rolling=null;
      $("go").textContent="🎲 开始抽奖";
      var final=names.slice().sort(function(){return Math.random()-0.5;}).slice(0,cnt);
      $("winner").textContent="🎉 "+final.join("、");
      hist=final.concat(hist).slice(0,30);
      $("hist").innerHTML="已中奖："+hist.map(function(x){return "<span>"+x+"</span>";}).join("");
    }
  },100);
};
$("clearh").onclick=function(){hist=[];$("hist").innerHTML="";};
})();
</script>
</body>
</html>
