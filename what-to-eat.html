<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>今天吃什么 - 知闲工具箱</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#fff7ed;color:#333;min-height:100vh;padding:16px;max-width:640px;margin:0 auto;text-align:center}
.topnav{display:flex;align-items:center;margin-bottom:12px;text-align:left}
.topnav a{color:#ea580c;text-decoration:none;font-size:17px}
h1{font-size:26px;margin:8px 0 4px;color:#9a3412}
.sub{color:#999;font-size:14px;margin-bottom:20px}
#dish{font-size:52px;font-weight:bold;color:#c2410c;min-height:120px;display:flex;align-items:center;justify-content:center;background:#fff;border:3px solid #fdba74;border-radius:16px;margin-bottom:20px;padding:20px;line-height:1.3}
#go{background:#ea580c;color:#fff;font-size:24px;font-weight:bold;border:none;border-radius:14px;padding:18px 60px;cursor:pointer;margin-bottom:16px}
#go:active{transform:scale(.96)}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.tabs button{font-size:16px;padding:10px 18px;border-radius:20px;border:2px solid #fed7aa;background:#fff;color:#9a3412;cursor:pointer}
.tabs button.on{background:#ea580c;color:#fff;border-color:#ea580c}
.custom{margin-top:8px}
.custom input{font-size:17px;padding:12px;border:2px solid #fed7aa;border-radius:10px;width:70%;margin-right:6px}
.custom button{font-size:17px;padding:12px 16px;background:#fff;border:2px solid #fed7aa;border-radius:10px;color:#9a3412;cursor:pointer}
#mylist{margin-top:12px;font-size:15px;color:#78716c;line-height:2}
#mylist span{background:#ffedd5;border-radius:8px;padding:4px 10px;margin:2px;display:inline-block}
.footer{color:#bbb;font-size:12px;margin-top:24px;padding-bottom:20px}
</style>
</head>
<body>
<div class="topnav"><a href="index.html">‹ 返回工具箱</a></div>
<h1>今天吃什么</h1>
<div class="sub">选择困难症终结者，点一下就行</div>

<div class="tabs" id="tabs"></div>
<div id="dish">点下方按钮开吃</div>
<button id="go">🎲 随机来一个</button>

<div class="custom">
  <input id="newdish" placeholder="加个自家菜，比如：妈妈的红烧肉">
  <button id="add">添加</button>
  <div id="mylist"></div>
</div>

<div class="footer">知闲工具箱 · 免费 · 无广告 · 不收集信息</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
var CATS={
"家常":["西红柿炒鸡蛋","青椒肉丝","宫保鸡丁","麻婆豆腐","红烧肉","糖醋排骨","清蒸鲈鱼","蒜蓉西兰花","地三鲜","回锅肉","酸辣土豆丝","水煮鱼","可乐鸡翅","番茄牛腩","干煸豆角"],
"面食":["炸酱面","牛肉面","担担面","臊子面","葱油拌面","热干面","刀削面","烩面","凉皮","饺子","包子","馄饨","炒河粉","米线"],
"快餐":["黄焖鸡","沙县小吃","兰州拉面","麻辣烫","冒菜","盖浇饭","煲仔饭","便当","汉堡","披萨","寿司","轻食沙拉"],
"下馆子":["火锅","烧烤","烤鱼","小龙虾","自助餐","日料","粤菜","川菜","湘菜","东北菜","西北菜","江浙菜"]
};
var cur="家常", mine=[];
try{mine=JSON.parse(localStorage.getItem("zx_myfood")||"[]");}catch(e){mine=[];}
function saveMine(){try{localStorage.setItem("zx_myfood",JSON.stringify(mine));}catch(e){}}
function pool(){
  var p=CATS[cur].slice();
  if(cur==="家常")p=p.concat(mine);
  return p;
}
Object.keys(CATS).forEach(function(k){
  var b=document.createElement("button");
  b.textContent=k;b.dataset.k=k;
  if(k===cur)b.className="on";
  b.onclick=function(){
    cur=k;
    var all=$("tabs").querySelectorAll("button");
    for(var i=0;i<all.length;i++)all[i].className="";
    b.className="on";
  };
  $("tabs").appendChild(b);
});
var rolling=null;
$("go").onclick=function(){
  var p=pool();
  if(!p.length)return;
  if(rolling)clearInterval(rolling);
  var n=0;
  $("go").textContent="停！";
  rolling=setInterval(function(){
    $("dish").textContent=p[Math.floor(Math.random()*p.length)];
    if(++n>14){
      clearInterval(rolling);rolling=null;
      $("go").textContent="🎲 随机来一个";
      $("dish").textContent="就吃「"+p[Math.floor(Math.random()*p.length)]+"」！";
    }
  },90);
};
function renderMine(){
  $("mylist").innerHTML=mine.map(function(x){return "<span>"+x+"</span>";}).join("");
}
$("add").onclick=function(){
  var v=$("newdish").value.trim();
  if(!v)return;
  mine.push(v);saveMine();renderMine();
  $("newdish").value="";
};
renderMine();
})();
</script>
</body>
</html>
