<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>证件照工具 - 知闲聊科技</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --brand: #e8590c; --brand-light: #fff3e8; --ink: #222; --gray: #666; --line: #eee; }
  body { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
         font-size: 18px; line-height: 1.7; color: var(--ink); background: #f5f5f5; }
  .slogan { background: var(--brand); color: #fff; text-align: center; padding: 14px 12px;
            font-size: 19px; font-weight: 700; letter-spacing: 2px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 14px 40px; }
  .hero { text-align: center; padding: 18px 0 6px; }
  .hero h1 { font-size: 26px; margin-bottom: 6px; }
  .hero p { color: var(--gray); font-size: 16px; }
  .card { background: #fff; border-radius: 16px; padding: 20px 18px; margin-top: 14px;
          box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .step { display: flex; align-items: center; margin-bottom: 14px; }
  .stepnum { width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: #fff;
             font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center;
             margin-right: 10px; flex-shrink: 0; }
  .step h2 { font-size: 20px; }
  .btn { display: block; width: 100%; min-height: 60px; border: none; border-radius: 12px;
         background: var(--brand); color: #fff; font-size: 20px; font-weight: 700;
         cursor: pointer; margin-top: 6px; }
  .btn:active { opacity: .85; }
  .btn.secondary { background: #fff; color: var(--brand); border: 2px solid var(--brand); }
  .btn:disabled { background: #ccc; cursor: not-allowed; }
  .optgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 6px; }
  .opt { border: 2px solid var(--line); border-radius: 12px; padding: 14px 6px; text-align: center;
         font-size: 18px; cursor: pointer; background: #fff; user-select: none; }
  .opt small { display: block; color: var(--gray); font-size: 13px; margin-top: 2px; }
  .opt.on { border-color: var(--brand); background: var(--brand-light); color: var(--brand); font-weight: 700; }
  .opt.on small { color: var(--brand); }
  .colors { display: flex; gap: 14px; margin-top: 8px; }
  .swatch { width: 72px; text-align: center; cursor: pointer; }
  .dot { width: 64px; height: 64px; border-radius: 14px; margin: 0 auto 6px; border: 3px solid transparent; }
  .swatch.on .dot { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-light); }
  .swatch span { font-size: 16px; }
  .honest { background: #fffbe8; border: 1px dashed #d9a441; border-radius: 10px; padding: 12px 14px;
            font-size: 15px; color: #7a5b1e; margin-top: 12px; line-height: 1.7; }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .row label { font-size: 18px; }
  input[type=number] { font-size: 19px; padding: 12px; border: 2px solid var(--line); border-radius: 10px;
                      width: 110px; }
  input[type=number]:focus { border-color: var(--brand); outline: none; }
  .unit { font-size: 17px; color: var(--gray); }
  .preview { margin-top: 12px; text-align: center; }
  .preview img { max-width: 100%; border-radius: 10px; border: 1px solid var(--line); }
  .info { font-size: 17px; color: var(--gray); margin-top: 8px; text-align: center; }
  .info b { color: var(--brand); font-size: 20px; }
  .work { text-align: center; color: var(--brand); font-size: 17px; margin-top: 10px; min-height: 28px; }
  .thumb { max-width: 120px; border-radius: 8px; margin-top: 10px; border: 1px solid var(--line); }
  .foot { text-align: center; color: var(--gray); font-size: 15px; margin-top: 26px; line-height: 2; }
  .hiddenfile { display: none; }
  select { font-size: 19px; padding: 12px; border: 2px solid var(--line); border-radius: 10px; background: #fff; }
</style>
</head>
<body>
<div class="slogan">真免费 · 无广告 · 不登录</div>
<div class="wrap">
  <div class="hero">
    <h1>证件照工具</h1>
    <p>知闲聊科技官方工具 · 照片只在本地处理，不上传</p>
  </div>

  <div class="card">
    <div class="step"><div class="stepnum">1</div><h2>选择照片</h2></div>
    <label class="btn" for="fileInput" style="text-align:center; line-height:60px; display:block;">从手机 / 电脑选择照片</label>
    <input id="fileInput" class="hiddenfile" type="file" accept="image/*">
    <div class="preview"><img id="origThumb" class="thumb" style="display:none" alt="原图预览"></div>
  </div>

  <div class="card">
    <div class="step"><div class="stepnum">2</div><h2>选择规格</h2></div>
    <div class="optgrid" id="specGrid">
      <div class="opt on" data-i="0">一寸<small>295×413px</small></div>
      <div class="opt" data-i="1">二寸<small>413×626px</small></div>
      <div class="opt" data-i="2">自定义<small>自己填尺寸</small></div>
    </div>
    <div class="row" id="customRow" style="display:none">
      <label>宽 <input type="number" id="customW" value="295" min="1" max="5000"> <span class="unit">px</span></label>
      <label>高 <input type="number" id="customH" value="413" min="1" max="5000"> <span class="unit">px</span></label>
    </div>
  </div>

  <div class="card">
    <div class="step"><div class="stepnum">3</div><h2>选择底色</h2></div>
    <div class="colors" id="colorRow">
      <div class="swatch on" data-i="0"><div class="dot" style="background:#438edb"></div><span>蓝色</span></div>
      <div class="swatch" data-i="1"><div class="dot" style="background:#ff0000"></div><span>红色</span></div>
      <div class="swatch" data-i="2"><div class="dot" style="background:#ffffff;border-color:#ddd"></div><span>白色</span></div>
    </div>
    <div class="honest">纯色底打底，非AI智能换底：本工具把照片按规格居中裁剪、以所选颜色打底，不做AI抠图换底。如需标准证件照效果，请在对应纯色背景前拍摄。</div>
  </div>

  <div class="card">
    <div class="step"><div class="stepnum">4</div><h2>目标文件大小</h2></div>
    <div class="row">
      <label>压缩到约 <input type="number" id="targetKB" value="60" min="5" max="5000"> <span class="unit">KB（报名、考试常用20-60KB）</span></label>
    </div>
    <div class="work" id="workText"></div>
    <div class="preview"><img id="resultImg" style="display:none" alt="证件照成品"></div>
    <div class="info" id="resultInfo" style="display:none"></div>
    <button class="btn secondary" id="dlPhotoBtn" style="display:none; margin-top:12px;">下载证件照</button>
  </div>

  <div class="card">
    <div class="step"><div class="stepnum">5</div><h2>拼版打印（拿去打印店用）</h2></div>
    <div class="row">
      <label>相纸
        <select id="paperSel">
          <option value="0">5寸相纸</option>
          <option value="1">6寸相纸</option>
        </select>
      </label>
      <span class="unit">300dpi，自动排满</span>
    </div>
    <button class="btn" id="layoutBtn" style="margin-top:12px;">生成拼版图</button>
    <div class="preview"><img id="layoutImg" style="display:none" alt="拼版预览"></div>
    <div class="info" id="layoutInfo" style="display:none"></div>
    <button class="btn secondary" id="dlLayoutBtn" style="display:none; margin-top:12px;">下载拼版图</button>
  </div>

  <div class="foot">
    知闲聊科技官方工具<br>
    真免费 · 无广告 · 不登录<br>
    所有处理都在您的设备本地完成，照片不会上传到任何服务器
  </div>
</div>

<canvas id="workCanvas" style="display:none"></canvas>
<canvas id="layoutCanvas" style="display:none"></canvas>

<script>
(function () {
  'use strict';

  // ---- 常量（对标小程序版） ----
  var SPECS = [
    { name: '一寸', w: 295, h: 413 },
    { name: '二寸', w: 413, h: 626 },
    { name: '自定义', w: 0, h: 0 }
  ];
  var COLORS = [
    { name: '蓝底', value: '#438edb' },
    { name: '红底', value: '#ff0000' },
    { name: '白底', value: '#ffffff' }
  ];
  var PAPERS = [
    { name: '5寸', w: 1499, h: 1051 },   // 127mm x 89mm @300dpi
    { name: '6寸', w: 1795, h: 1205 }    // 152mm x 102mm @300dpi
  ];
  var GAP = 14; // 拼版照片间距，方便裁剪

  // ---- 状态 ----
  var state = {
    img: null,          // 已加载的原图 Image 对象
    specIdx: 0,
    colorIdx: 0,
    paperIdx: 0,
    bestQ: 80,          // 二分逼近得到的最优画质
    hasResult: false,
    working: false
  };

  // ---- DOM ----
  function $(id) { return document.getElementById(id); }
  var fileInput = $('fileInput'), origThumb = $('origThumb'),
      resultImg = $('resultImg'), resultInfo = $('resultInfo'),
      dlPhotoBtn = $('dlPhotoBtn'), workText = $('workText'),
      layoutBtn = $('layoutBtn'), layoutImg = $('layoutImg'),
      layoutInfo = $('layoutInfo'), dlLayoutBtn = $('dlLayoutBtn'),
      workCanvas = $('workCanvas'), layoutCanvas = $('layoutCanvas');

  function tick() { return new Promise(function (r) { setTimeout(r, 30); }); }

  function fmtSize(bytes) {
    if (!bytes || bytes <= 0) return '0B';
    return (bytes / 1024).toFixed(1) + 'KB';
  }

  function getSpec() {
    var s = SPECS[state.specIdx];
    if (s.w > 0) return { w: s.w, h: s.h, name: s.name };
    var w = Math.max(1, parseInt($('customW').value, 10) || 0);
    var h = Math.max(1, parseInt($('customH').value, 10) || 0);
    return { w: w, h: h, name: '自定义' };
  }

  function getTargetKB() {
    var v = parseInt($('targetKB').value, 10);
    if (!v || v < 5) v = 5;
    return v;
  }

  // ---- 选择照片（本地读取，不上传） ----
  fileInput.addEventListener('change', function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var im = new Image();
      im.onload = function () {
        state.img = im;
        origThumb.src = rd.result;
        origThumb.style.display = '';
        makePhoto();
      };
      im.onerror = function () { alert('图片读取失败，请换一张试试'); };
      im.src = rd.result;
    };
    rd.readAsDataURL(f);
  });

  // ---- 规格 / 底色 / 参数 ----
  function bindGrid(id, key, cb) {
    var grid = $(id);
    grid.addEventListener('click', function (e) {
      var el = e.target.closest('[data-i]');
      if (!el) return;
      var items = grid.querySelectorAll('[data-i]');
      for (var i = 0; i < items.length; i++) items[i].classList.remove('on');
      el.classList.add('on');
      state[key] = parseInt(el.getAttribute('data-i'), 10);
      if (cb) cb();
      remake();
    });
  }
  bindGrid('specGrid', 'specIdx', function () {
    $('customRow').style.display = state.specIdx === 2 ? '' : 'none';
  });
  bindGrid('colorRow', 'colorIdx');

  $('customW').addEventListener('change', remake);
  $('customH').addEventListener('change', remake);
  $('targetKB').addEventListener('change', remake);
  $('paperSel').addEventListener('change', function () {
    state.paperIdx = parseInt($('paperSel').value, 10);
    // 相纸切换后拼版需重新生成
    layoutImg.style.display = 'none';
    layoutInfo.style.display = 'none';
    dlLayoutBtn.style.display = 'none';
  });

  function remake() {
    if (state.img && !state.working) makePhoto();
  }

  // ---- 核心：在 workCanvas 上按规格渲染单张证件照 ----
  // 返回 { dataURL, size }，size 为估算字节数
  function renderPhoto(w, h, color, q) {
    workCanvas.width = w;
    workCanvas.height = h;
    var ctx = workCanvas.getContext('2d');
    // 先铺纯色底（打底色，非AI换底）
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, w, h);
    var iw = state.img.naturalWidth, ih = state.img.naturalHeight;
    var ir = iw / ih, tr = w / h, sw, sh, sx, sy;
    if (ir > tr) { sh = ih; sw = sh * tr; sx = (iw - sw) / 2; sy = 0; }
    else { sw = iw; sh = sw / tr; sx = 0; sy = (ih - sh) / 2; }
    ctx.drawImage(state.img, sx, sy, sw, sh, 0, 0, w, h);
    var url = workCanvas.toDataURL('image/jpeg', q / 100);
    var comma = url.indexOf(',');
    var size = Math.round((url.length - comma - 1) * 3 / 4);
    return { dataURL: url, size: size };
  }

  // ---- 生成证件照：目标KB二分逼近画质（8轮） ----
  async function makePhoto() {
    if (!state.img || state.working) return;
    state.working = true;
    try {
      var spec = getSpec();
      var color = COLORS[state.colorIdx].value;
      var targetBytes = getTargetKB() * 1024;
      var lo = 5, hi = 100, best = null, bestQ = 80;
      for (var i = 0; i < 8; i++) {
        var q = Math.round((lo + hi) / 2);
        workText.textContent = '正在生成证件照（第 ' + (i + 1) + ' 轮）…';
        await tick();
        var r = renderPhoto(spec.w, spec.h, color, q);
        if (!best || Math.abs(r.size - targetBytes) < Math.abs(best.size - targetBytes)) {
          best = r; bestQ = q;
        }
        if (Math.abs(r.size - targetBytes) <= targetBytes * 0.08) break; // 误差8%内接受
        if (r.size > targetBytes) hi = q; else lo = q;
        if (hi - lo <= 2) break;
      }
      // 定稿：用最优画质重渲一次，保证下载与预览一致
      var fin = renderPhoto(spec.w, spec.h, color, bestQ);
      state.bestQ = bestQ;
      state.hasResult = true;
      resultImg.src = fin.dataURL;
      resultImg.style.display = '';
      var note = (best && Math.abs(best.size - targetBytes) > targetBytes * 0.25)
        ? '<br>已压到最小，仍达不到目标大小，可调大目标KB' : '';
      resultInfo.innerHTML = '规格：' + spec.name + ' ' + spec.w + '×' + spec.h + 'px<br>' +
        '大小：<b>' + fmtSize(fin.size) + '</b>（目标约' + getTargetKB() + 'KB）' + note;
      resultInfo.style.display = '';
      dlPhotoBtn.style.display = '';
      // 拼版需重新生成
      layoutImg.style.display = 'none';
      layoutInfo.style.display = 'none';
      dlLayoutBtn.style.display = 'none';
      workText.textContent = '';
    } catch (e) {
      workText.textContent = '生成失败，请重试';
    }
    state.working = false;
  }

  // ---- 拼版：排满 5寸/6寸相纸 ----
  layoutBtn.addEventListener('click', function () {
    if (!state.hasResult || state.working) {
      if (!state.hasResult) alert('请先选择照片生成证件照');
      return;
    }
    state.working = true;
    workText.textContent = '正在排版…';
    setTimeout(function () {
      try {
        var paper = PAPERS[state.paperIdx];
        var spec = getSpec();
        var cols = Math.max(1, Math.floor((paper.w + GAP) / (spec.w + GAP)));
        var rows = Math.max(1, Math.floor((paper.h + GAP) / (spec.h + GAP)));
        // 用最优画质重渲单张作为拼版底图
        renderPhoto(spec.w, spec.h, COLORS[state.colorIdx].value, state.bestQ);
        layoutCanvas.width = paper.w;
        layoutCanvas.height = paper.h;
        var ctx = layoutCanvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, paper.w, paper.h);
        for (var r = 0; r < rows; r++) {
          for (var c = 0; c < cols; c++) {
            ctx.drawImage(workCanvas, c * (spec.w + GAP), r * (spec.h + GAP), spec.w, spec.h);
          }
        }
        layoutImg.src = layoutCanvas.toDataURL('image/jpeg', 0.92);
        layoutImg.style.display = '';
        layoutInfo.innerHTML = paper.name + '相纸：' + cols + '×' + rows + '，共 <b>' + (cols * rows) + '</b> 张（300dpi，可直接拿去打印店）';
        layoutInfo.style.display = '';
        dlLayoutBtn.style.display = '';
      } catch (e) {
        alert('排版失败，请重试');
      }
      workText.textContent = '';
      state.working = false;
    }, 30);
  });

  // ---- 下载 ----
  function downloadCanvas(canvas, filename, quality) {
    if (canvas.toBlob) {
      canvas.toBlob(function (blob) {
        if (!blob) { alert('导出失败，请重试'); return; }
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 8000);
      }, 'image/jpeg', quality);
    } else {
      // 兜底：老浏览器用 dataURL 下载
      var a = document.createElement('a');
      a.href = canvas.toDataURL('image/jpeg', quality);
      a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
    }
  }

  dlPhotoBtn.addEventListener('click', function () {
    var spec = getSpec();
    // 确保下载的是最优画质版本
    renderPhoto(spec.w, spec.h, COLORS[state.colorIdx].value, state.bestQ);
    var fname = '证件照_' + spec.name + '_' + COLORS[state.colorIdx].name + '.jpg';
    downloadCanvas(workCanvas, fname, state.bestQ / 100);
  });

  dlLayoutBtn.addEventListener('click', function () {
    var fname = '证件照拼版_' + PAPERS[state.paperIdx].name + '相纸.jpg';
    downloadCanvas(layoutCanvas, fname, 0.92);
  });
})();
</script>
</body>
</html>
